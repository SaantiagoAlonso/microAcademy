services:

  postgres-db:
    image: postgres:16
    container_name: postgres-db
    environment:
      POSTGRES_USER: userdata
      POSTGRES_PASSWORD: 123456
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - academy-net

  mongo-curses:
    image: mongo:6.0
    container_name: mongo-curses
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: userdata
      MONGO_INITDB_ROOT_PASSWORD: 123456
    volumes:
      - mongo_curses_data:/data/db
    networks:
      - academy-net

  mongo-teachers:
    image: mongo:6.0
    container_name: mongo-teachers
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: userdata
      MONGO_INITDB_ROOT_PASSWORD: 123456
    volumes:
      - mongo_teachers_data:/data/db
    networks:
      - academy-net

  mongo-students:
    image: mongo:6.0
    container_name: mongo-students
    ports:
      - "27019:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: userdata
      MONGO_INITDB_ROOT_PASSWORD: 123456
    volumes:
      - mongo_students_data:/data/db
    networks:
      - academy-net

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: 123456
    ports:
      - "5050:80"
    depends_on:
      - postgres-db
    networks:
      - academy-net

  mongo-express-curses:
    image: mongo-express
    container_name: mongo-express-curses
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo-curses
      ME_CONFIG_MONGODB_ADMINUSERNAME: userdata
      ME_CONFIG_MONGODB_ADMINPASSWORD: 123456
    depends_on:
      - mongo-curses
    networks:
      - academy-net

  mongo-express-teachers:
    image: mongo-express
    container_name: mongo-express-teachers
    ports:
      - "8082:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo-teachers
      ME_CONFIG_MONGODB_ADMINUSERNAME: userdata
      ME_CONFIG_MONGODB_ADMINPASSWORD: 123456
    depends_on:
      - mongo-teachers
    networks:
      - academy-net

  mongo-express-students:
    image: mongo-express
    container_name: mongo-express-students
    ports:
      - "8083:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo-students
      ME_CONFIG_MONGODB_ADMINUSERNAME: userdata
      ME_CONFIG_MONGODB_ADMINPASSWORD: 123456
    depends_on:
      - mongo-students
    networks:
      - academy-net

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: 123456
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - academy-net

  minio:
    image: quay.io/minio/minio
    container_name: minio
    ports:
      - "9000:9000"   # API S3-compatible
      - "9001:9001"   # Consola web
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data

volumes:
  postgres_data:
  mongo_curses_data:
  mongo_teachers_data:
  mongo_students_data:
  rabbitmq_data:
  minio-data:

networks:
  academy-net:
    driver: bridge